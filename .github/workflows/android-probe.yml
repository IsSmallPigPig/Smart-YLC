name: AndroidProbe
on:
  push:
    paths: [".github/workflows/android-probe.yml"]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 环境速查
        run: |
          echo "ROOT=[$ANDROID_SDK_ROOT] HOMEVAR=[$ANDROID_HOME]"
          find / -maxdepth 6 -name sdkmanager -type f 2>/dev/null | head -5
      - name: 准备 Android SDK
        run: |
          SM=""
          for cand in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" \
                      /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            [ -n "$cand" ] && [ -d "$cand" ] || continue
            SM=$(find "$cand" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -1)
            if [ -n "$SM" ]; then SDK="$cand"; break; fi
          done
          if [ -z "$SM" ]; then
            echo "::error::找不到 sdkmanager"
            ls -d /usr/local/lib/android* /opt/android* 2>/dev/null || true
            exit 1
          fi
          echo "SDK=$SDK"; echo "sdkmanager=$SM"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - name: 恢复调试签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"
      - name: 编译 APK
        run: |
          sudo mkdir -p /Volumes/AnkoQAQ/kotlin-dev/build/smart-youth
          sudo chown -R "$USER":"$(id -g)" /Volumes/AnkoQAQ
          cd mobile
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          VER=$(sed -n 's/.*appVersionName"\] = "\([^"]*\)".*/\1/p' build.gradle.kts)
          echo "VER=$VER"
          ls -lh /Volumes/AnkoQAQ/kotlin-dev/build/smart-youth/_app/outputs/apk/debug/
