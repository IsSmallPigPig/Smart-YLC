name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  # Windows runner 的 Python 默认按 locale 编码写 stdout（cp1252），
  # 打印含中文的路径会 UnicodeEncodeError；统一按 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 内部标识：bundle id、可执行文件名保持 ASCII，避免签名/路径上的麻烦
  APP_NAME: SmartYouth
  # 用户看到的名字：.app / .exe / 安装镜像里的显示名
  APP_DISPLAY_NAME: 智慧团委
  BUNDLE_ID: com.smallylc.smartyouth

jobs:
  build-macos:
    # 只出 Apple Silicon：PyQt5 5.15 的 macOS 轮子是 universal2，但 Intel 机器
    # 已停售、构建时间翻倍，不再单独出 x86_64 包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests pymupdf "numpy<2" "cryptography==41.0.7" "opencv-python-headless==4.8.1.78" qrcode
          pip install pyobjc-framework-Cocoa pyobjc-framework-UserNotifications

      - name: 生成应用图标（icns）
        run: |
          SRC="app/assets/smart-ylc@1024.png"
          ICONSET="build/$APP_NAME.iconset"
          mkdir -p "$ICONSET"
          # iconutil 要完整的 10 个条目：1x 与 @2x 各五档。之前只生成 1x 五档再补
          # 三档 @2x，漏了 16@2x 与 32@2x，Dock 和访达里的小图标会发虚。
          for spec in "16:16x16" "32:16x16@2x" "32:32x32" "64:32x32@2x" \
                      "128:128x128" "256:128x128@2x" "256:256x256" \
                      "512:256x256@2x" "512:512x512" "1024:512x512@2x"; do
            px="${spec%%:*}"; name="${spec##*:}"
            sips -z "$px" "$px" "$SRC" --out "$ICONSET/icon_${name}.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "build/$APP_NAME.icns"
          # 导出一次确认 icns 里真有图：空图标时 iconutil 也可能成功返回
          sips -g pixelWidth "build/$APP_NAME.icns" > /dev/null

      - name: PyInstaller 打包（.app）
        # 脚本负责资源、bundle id、版本，以及把产物改名成 dist/智慧团委.app
        run: python scripts/build.py

      - name: 校验应用图标
        run: |
          PLIST="dist/$APP_DISPLAY_NAME.app/Contents/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$PLIST" || true)
          if [ -z "$NAME" ]; then
            echo "::error::Info.plist 没有 CFBundleIconFile，.app 会用默认图标"
            exit 1
          fi
          ICON="dist/$APP_DISPLAY_NAME.app/Contents/Resources/$NAME"
          if [ ! -f "$ICON" ]; then
            echo "::error::找不到 $ICON"
            exit 1
          fi
          if ! cmp -s "build/$APP_NAME.icns" "$ICON"; then
            echo "::error::打包进 .app 的图标与 build/$APP_NAME.icns 不一致（回退成默认图标）"
            exit 1
          fi
          echo "应用图标已嵌入：$NAME ($(stat -f%z "$ICON") 字节)"

      - name: 制作 dmg 安装镜像
        run: |
          set -euo pipefail
          DMGROOT="dist/dmgroot"
          rm -rf "$DMGROOT"; mkdir -p "$DMGROOT"
          # ditto 比 cp -R 更稳：保留扩展属性与资源分支，复制后签名不会失效
          ditto "dist/$APP_DISPLAY_NAME.app" "$DMGROOT/$APP_DISPLAY_NAME.app"
          # GPLv3 要求随二进制一并分发许可证全文
          cp LICENSE "$DMGROOT/许可证.txt"
          # 一次成型：不再「挂载—设卷图标—卸载—转换」。挂载后卸载在 runner 上会偶发
          # 「Resource busy」，整条发布就断在这步；卷图标只是 Finder 里的观感，
          # 应用图标本身在 .app 里，不受影响。
          # 产物名只用 ASCII：中文文件名在 Release 上会被剥成 "-macOS-arm64.dmg"，
          # 卷名与包内 .app 仍是「智慧团委」
          OUT="dist/$APP_NAME-macOS-arm64.dmg"
          ok=0
          for attempt in 1 2 3; do
            rm -f "$OUT"
            # 不把输出吞到 /dev/null：失败时日志里只剩 exit code 1，根本看不出
            # 是资源忙、空间不足还是卷名问题
            if hdiutil create -volname "$APP_DISPLAY_NAME" -srcfolder "$DMGROOT" \
                 -ov -format UDZO "$OUT"; then
              ok=1
              break
            fi
            echo "::warning::hdiutil 第 $attempt 次失败，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::dmg 制作失败（已重试 3 次），见上面的 hdiutil 输出"
            exit 1
          fi
          rm -rf "$DMGROOT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-macOS-arm64
          path: dist/${{ env.APP_NAME }}-macOS-arm64.dmg
          if-no-files-found: error

  build-windows:
    # Windows 四种组合统一跑这一个 job：Win10/11 与 Win7、64 位与 32 位。
    # 产物命名与系统、位数一一对应，下载列表一眼能分清：
    #   SmartYouth-Windows10-x64-setup.exe   Win10/11 64 位（Python 3.11）
    #   SmartYouth-Windows10-x86-setup.exe   Win10/11 32 位（Python 3.11）
    #   SmartYouth-Windows7-x64-setup.exe    Windows 7 64 位（Python 3.8）
    #   SmartYouth-Windows7-x86-setup.exe    Windows 7 32 位（Python 3.8）
    #
    # 为什么 Win7 必须用 Python 3.8：CPython 3.9 起要求 Windows 8+。
    # 为什么 Win7 组钉 PyInstaller 5.13.2：官方只保证 Win8+，5.x 的引导程序
    # 仍能在 Win7 上跑，6.x 起不再验证。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows10-x64
            os: Windows10
            bit: "64"
            python: "3.11"
            pyinstaller: "pyinstaller"
            # opencv 4.8.1 按 numpy 1.x ABI 编译；不钉 numpy 会装到 2.x，
            # 冻结包 import cv2 抛 _ARRAY_API not found，查空格整批失效。
            deps: '"PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests "pymupdf==1.24.11" "numpy<2" "cryptography==41.0.7" "opencv-python-headless==4.8.1.78" qrcode'
          - name: Windows10-x86
            os: Windows10
            bit: "32"
            python: "3.11"
            pyinstaller: "pyinstaller"
            # 钉 1.24.11：新版 PyMuPDF 没有 win32 wheel，pip 会回退到 88MB 的 sdist
            # 现场编译 MuPDF，卡在 "Preparing metadata" 几十分钟。1.24.11 的
            # cp38-abi3 wheel 兼容 3.11，四个 Windows 变体与 Win7 组同版本。
            # numpy 同样要钉 <2：理由见上方 Windows10-x64。
            deps: '"PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests "pymupdf==1.24.11" "numpy<2" "cryptography==41.0.7" "opencv-python-headless==4.8.1.78" qrcode'
          - name: Windows7-x64
            os: Windows7
            bit: "64"
            python: "3.8"
            pyinstaller: "pyinstaller==5.13.2"
            # 3.8 必须钉版本：新版 PyMuPDF 要 >=3.10、numpy 2.x 要 >=3.9
            deps: '"PyQt5==5.15.11" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine==5.15.7" pypdf "pillow<11" openpyxl requests "pymupdf==1.24.11" "numpy<1.25" "cryptography==41.0.7" "opencv-python-headless==4.8.1.78" qrcode'
          - name: Windows7-x86
            os: Windows7
            bit: "32"
            python: "3.8"
            pyinstaller: "pyinstaller==5.13.2"
            deps: '"PyQt5==5.15.11" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine==5.15.7" pypdf "pillow<11" openpyxl requests "pymupdf==1.24.11" "numpy<1.25" "cryptography==41.0.7" "opencv-python-headless==4.8.1.78" qrcode'
    env:
      PKG_NAME: SmartYouth-${{ matrix.name }}-setup
      TARGET_OS: ${{ matrix.os }}
      IS_64: ${{ matrix.bit == '64' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.bit == '32' && 'x86' || 'x64' }}

      - name: 确认解释器版本与架构
        shell: pwsh
        run: |
          python -c "import platform,sys;print('python:',platform.python_version(),platform.architecture()[0],platform.machine())"
          python -c "import platform;assert platform.architecture()[0]=='${{ matrix.bit }}bit'"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.pyinstaller }}
          python -m pip install ${{ matrix.deps }}

      - name: PyInstaller 打包（onedir）
        run: python scripts/build.py
        shell: pwsh

      - name: 冒烟检查（冻结产物真能起窗口）
        # 分析期 import 通过不代表能跑：缺 DLL、缺 Qt 插件都在这一步暴露。
        # 产物是 --windowed（无控制台），从管道拿不到 stdout 与退出码，
        # 让程序把结论写进文件，这里读文件判断。
        shell: pwsh
        run: |
          $env:HOME = Join-Path $env:TEMP "smoke-${{ matrix.name }}"
          $env:USERPROFILE = $env:HOME
          $result = Join-Path $env:TEMP "smoke-result-${{ matrix.name }}.txt"
          Remove-Item $result -ErrorAction SilentlyContinue
          $exe = "dist\SmartYouth\$($env:APP_DISPLAY_NAME).exe"
          if (-not (Test-Path $exe)) { throw "找不到打包产物 $exe" }
          # 单行写，不用反引号续行：YAML 块里行尾空格会让续行悄悄失效
          $p = Start-Process -FilePath $exe -PassThru -Wait -ArgumentList "--smoke-test", "--smoke-result", $result
          Write-Host "退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "冻结产物冒烟失败（退出码 $($p.ExitCode)）" }
          if (-not (Test-Path $result)) { throw "冒烟没有写出结果文件 $result" }
          $text = Get-Content $result -Raw
          Write-Host $text
          if ($text -notmatch "SMOKE OK") { throw "冒烟结果里没有 SMOKE OK" }

      - name: 准备代码签名证书
        id: cert
        # 证书全平台通用，只由 64 位变体生成一份，避免四份重复的 .cer
        if: matrix.name == 'Windows10-x64'
        shell: pwsh
        env:
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "dist/installer" | Out-Null
          if ($env:SIGNPATH_API_TOKEN) {
            # SignPath 模式：私钥在云端 HSM，CI 不碰证书文件，只导出一张公钥证书
            # 供内部分发时手动信任
            "mode=signpath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "signtool=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "password=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "使用 SignPath 云端签名"
            exit 0
          }
          $pwd = ""
          if ($env:WIN_CERT_PFX_B64) {
            $bytes = [Convert]::FromBase64String($env:WIN_CERT_PFX_B64)
            [IO.File]::WriteAllBytes("cert.pfx", $bytes)
            $pwd = $env:WIN_CERT_PASSWORD
            $xc = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("cert.pfx", $pwd)
            "mode=secret" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "使用仓库 Secrets 中的证书签名"
          } else {
            $pwd = "LocalSign!" + ([guid]::NewGuid().ToString('N').Substring(0, 10))
            $xc = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=智慧团委 (SmartYouth)" `
              -KeyUsage DigitalSignature -FriendlyName "SmartYouth Code Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable `
              -NotAfter (Get-Date).AddYears(3) `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $sp = ConvertTo-SecureString -String $pwd -Force -AsPlainText
            Export-PfxCertificate -Cert $xc -FilePath "cert.pfx" -Password $sp | Out-Null
            "mode=selfsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "未配置证书 Secrets，已生成本次自签名证书"
          }
          Export-Certificate -Cert $xc -FilePath "dist/installer/SmartYouth-CodeSigning.cer" | Out-Null
          "password=$pwd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" `
            -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) {
            "signtool=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "signtool=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "找不到 signtool，产物未签名"
          }

      - name: 签名主程序
        if: matrix.name == 'Windows10-x64' && steps.cert.outputs.signtool != ''
        shell: pwsh
        env:
          SIGN_PWD: ${{ steps.cert.outputs.password }}
        run: |
          $st = "${{ steps.cert.outputs.signtool }}"
          $exe = "dist\SmartYouth\$($env:APP_DISPLAY_NAME).exe"
          & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 $exe }
          if ($LASTEXITCODE -ne 0) { Write-Warning "主程序签名失败" } else { Write-Host "主程序已签名" }

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq 'workflow_dispatch') { $ver = "1.0.0" }
          # choco 装的 innosetup 会随上游发新大版本换安装目录（6 -> 7），
          # 写死路径会在某天毫无征兆地失败，这里按版本号找最新的那个
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe",
                                 "C:\Program Files\Inno Setup*\ISCC.exe" `
                             -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -Expand FullName
          if (-not $iscc) { throw "找不到 ISCC.exe（Inno Setup 未装好）" }
          Write-Host "使用编译器：$iscc"
          # 参数用数组传，不靠反引号续行。产物名整体传入，安装脚本不再自己拼后缀
          $defs = @("/DAppVersion=$ver", "/DOutputName=$env:PKG_NAME",
                    "/DTargetOS=$env:TARGET_OS", "/DIs64=$env:IS_64")
          & $iscc @defs "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译安装包失败" }
          $out = "dist\installer\$($env:PKG_NAME).exe"
          if (-not (Test-Path $out)) { throw "安装包没有生成：$out" }
          Get-Item $out | Select-Object Name, Length

      - name: 签名安装包
        if: matrix.name == 'Windows10-x64' && steps.cert.outputs.signtool != ''
        shell: pwsh
        env:
          SIGN_PWD: ${{ steps.cert.outputs.password }}
        run: |
          $st = "${{ steps.cert.outputs.signtool }}"
          $setup = "dist\installer\$($env:PKG_NAME).exe"
          & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 $setup }
          if ($LASTEXITCODE -ne 0) { Write-Warning "安装包签名失败" } else { Write-Host "安装包已签名" }

      - uses: actions/upload-artifact@v6
        with:
          # 证书只在 64 位变体里生成，跟着它一起传，不另外单独跑一个 job
          name: SmartYouth-${{ matrix.name }}
          path: |
            dist/installer/${{ env.PKG_NAME }}.exe
            dist/installer/SmartYouth-CodeSigning.cer
          if-no-files-found: error

  build-linux:
    # 只在 x86_64 出 .deb：ubuntu-22.04 的 glibc 2.35 比 24.04 更旧，
    # 编出来的包能装的发行版范围更大（deb 不校验 glibc 下限，兼容全靠构建机）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装系统依赖
        # PyInstaller 分析阶段要真的 import PyQt5，缺 libGL/libEGL 直接崩；
        # Qt xcb 平台插件的运行时依赖也一并列进 deb 的 Depends；xvfb 供冒烟检查。
        # libxkbcommon-x11-0 / libxcb-xkb1 是 Qt6XcbQpa 的硬依赖（PyInstaller 只带
        # Qt6XcbQpa 本身，不带这两个系统库），缺了 xcb 插件报 "found but could not load"。
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            fontconfig libglib2.0-0 libx11-6 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxcb-xkb1 libxcb-xinput0 libsm6 libice6 \
            libxrender1 libxi6

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests pymupdf "numpy<2" "cryptography==41.0.7" "opencv-python-headless==4.8.1.78" qrcode

      - name: PyInstaller 打包（onedir）
        # 脚本在 Linux 上输出 dist/SmartYouth/，并把图标铺进 share/icons/hicolor
        run: python scripts/build.py

      - name: 冒烟检查（Xvfb 真实 X11）
        # 分析期 import 过了不算数：这里验证冻结产物真能构造主窗口。
        # 必须用 Xvfb 而不是 QT_QPA_PLATFORM=offscreen——无边框窗口初始化
        # 在没有真实窗口系统时会段错误。浏览器页的 Chromium 沙箱在 CI root
        # 环境起不来，用 QTWEBENGINE_CHROMIUM_FLAGS 关掉（只影响这次冒烟）。
        # 先跑 ldd 诊断：xcb 插件报 "found but could not load" 时，Qt 只说
        # 插件名不说缺哪个库，这里直接把 not found 的 .so 列进日志。
        run: |
          XCB=$(find dist/SmartYouth -name "libqxcb.so" -path "*platforms*" | head -1)
          echo "xcb plugin: $XCB"
          ldd "$XCB" 2>/dev/null | grep "not found" || echo "（xcb 插件依赖完整）"
          QT_DEBUG_PLUGINS=1 QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox" \
            timeout 90 xvfb-run -a dist/SmartYouth/SmartYouth --smoke-test
          echo "冻结产物冒烟通过"

      - name: 制作 .deb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$VER" ] && VER="0.0.0"   # workflow_dispatch 时没 tag
          PKG="dist/deb"
          rm -rf "$PKG"; mkdir -p \
            "$PKG/DEBIAN" \
            "$PKG/opt/SmartYouth" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/512x512/apps" \
            "$PKG/usr/bin"
          cp -R dist/SmartYouth/. "$PKG/opt/SmartYouth/"
          # dist/SmartYouth/share 是 build.py 铺的 hicolor 图标，deb 里装到系统图标路径
          cp "$PKG/opt/SmartYouth/share/icons/hicolor/512x512/apps/SmartYouth.png" \
            "$PKG/usr/share/icons/hicolor/512x512/apps/" 2>/dev/null || \
            cp app/assets/smart-ylc@512.png "$PKG/usr/share/icons/hicolor/512x512/apps/SmartYouth.png"
          # 不用 heredoc：YAML block scalar 里 `<<EOF` 的结束标记带缩义就永不闭合，
          # 内容行前导空格也会污染 desktop/control 的键值解析，printf 逐行写最稳。
          printf '[Desktop Entry]\nType=Application\nName=智慧团委\nName[en]=SmartYouth\nExec=/opt/SmartYouth/SmartYouth\nIcon=SmartYouth\nTerminal=false\nCategories=Office;\nComment=多支部账号一屏管理\n' \
            > "$PKG/usr/share/applications/SmartYouth.desktop"
          ln -sf /opt/SmartYouth/SmartYouth "$PKG/usr/bin/smartyouth"
          SIZE=$(du -sk "$PKG/opt/SmartYouth" | cut -f1)
          printf 'Package: smartyouth\nVersion: %s\nArchitecture: amd64\nInstalled-Size: %s\nMaintainer: AnkoQAQ <ismsmallpigpig@outlook.com>\nDepends: libegl1, libgl1, libxkbcommon0, libdbus-1-3, fontconfig, libglib2.0-0, libx11-6, libxcb1, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xinerama0, libxkbcommon-x11-0, libxcb-xkb1, libxcb-xinput0, libsm6, libice6, libxrender1, libxi6, libnss3, libnspr4, libxcomposite1, libxdamage1, libxfixes3, libxtst6, libasound2, libcairo2, libpango-1.0-0, libatspi2.0-0, libcups2\nSection: utils\nPriority: optional\nDescription: 智慧团委助手（Smart-YLC helper）\n 多支部账号一屏管理：档案上传、组织状况、站内信与数据导出。\n Qt/PyQt5 运行时已随包携带，安装到 /opt/SmartYouth。\n' \
            "$VER" "$SIZE" > "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG" \
            "dist/$APP_NAME-Linux-x64.deb"
          ls -lh "dist/$APP_NAME-Linux-x64.deb"
          dpkg-deb -c "dist/$APP_NAME-Linux-x64.deb" | head -5

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Linux-x64
          path: dist/${{ env.APP_NAME }}-Linux-x64.deb
          if-no-files-found: error

  build-android:
    # 手机端跟桌面端进同一个 Release：用户在一页里拿齐所有平台，
    # 不必再去另一条 mobile-v* 发布里找安装包。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        # 版本对齐 mobile/build.gradle.kts 的 compileSdk / buildToolsVersion；
        # 只装这两个就够，AGP 自带其余按需依赖解析
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: 恢复调试签名
        # 手机上已经装着旧版，只认当初那份 key。换一份签名，新包会提示「应用未安装」，
        # 用户得先卸载——扫描件目录跟着一起被清掉。所以密钥必须来自同一个来源。
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_DEBUG_KEYSTORE_B64：签出来的包装不上旧版，这次发布等于白做"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: 编译 APK
        run: |
          # mobile/settings.gradle.kts 把构建目录钉在移动硬盘路径上（本机系统盘只剩百来 MB），
          # runner 没有那块盘，先把位置建出来，产物路径才跟本地一致
          sudo mkdir -p /Volumes/AnkoQAQ/kotlin-dev/build/smart-youth
          sudo chown -R "$USER":"$(id -g)" /Volumes/AnkoQAQ
          cd mobile
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          VER=$(sed -n 's/.*appVersionName"\] = "\([^"]*\)".*/\1/p' build.gradle.kts)
          test -n "$VER" || { echo "::error::读不到 appVersionName"; exit 1; }
          APK=/Volumes/AnkoQAQ/kotlin-dev/build/smart-youth/_app/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::没有生成 $APK"; exit 1; }
          mkdir -p ../dist/mobile
          cp "$APK" "../dist/mobile/SmartYouth-mobile-$VER.apk"
          ls -lh ../dist/mobile/

      - uses: actions/upload-artifact@v6
        with:
          name: SmartYouth-Android
          path: dist/mobile/*.apk
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 组合 Release 说明（下载信息 + 本版提交）
        # 前导文本放 docs/release-intro.md，可由 scripts/release.py --intro 更新；
        # 不写就沿用文件里的上一版，不必每次改 workflow。
        run: |
          {
            cat docs/release-intro.md
            echo
            echo "---"
            echo
            # 只贴本版本：段内每行都是本版的提交，历史版本留在仓库里备查
            awk '/^## v/{n++} n==1' CHANGELOG.md
          } > release_body.md

      - name: 校验主产物齐全
        # 六类主产物（dmg / 4 个 Windows setup / deb / apk）缺任何一个都算发布失败，
        # 但不能让「可选的 .cer」缺失把整条发布判红
        run: |
          missing=0
          for pat in "*.dmg" "*Windows10-x64-setup.exe" "*Windows10-x86-setup.exe" \
                     "*Windows7-x64-setup.exe" "*Windows7-x86-setup.exe" "*.deb" "*.apk"; do
            if ! find artifacts -name "$pat" | grep -q .; then
              echo "::error::缺少产物 $pat"
              missing=1
            fi
          done
          exit $missing
      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          generate_release_notes: false
          # 不设 fail_on_unmatched_files：它会因为「某个可选文件没产出」（例如没配
          # 签名时的 .cer）把整条发布判红，而真正要保证的是四类主产物齐全。
          # 主产物缺失由下面的校验步骤显式检查。
          fail_on_unmatched_files: false
          # 用通配而不是写死层级：artifact 内是否多一层目录取决于上传时给的路径，
          # 写死会让一个目录调整就整条发布失败。通配仍受 fail_on_unmatched_files 约束，
          # 少哪个产物照样红。
          files: |
            artifacts/**/*.dmg
            artifacts/**/*setup.exe
            artifacts/**/*.cer
            artifacts/**/*.deb
            artifacts/**/*.apk

