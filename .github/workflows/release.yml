name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  # Windows runner 的 Python 默认按 locale 编码写 stdout（cp1252），
  # 打印含中文的路径会 UnicodeEncodeError；统一按 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 内部标识：bundle id、可执行文件名保持 ASCII，避免签名/路径上的麻烦
  APP_NAME: SmartYouth
  # 用户看到的名字：.app / .exe / 安装镜像里的显示名
  APP_DISPLAY_NAME: 智慧团委
  BUNDLE_ID: com.smallylc.smartyouth

jobs:
  build-macos:
    # 只出 Apple Silicon：PyQt5 5.15 的 macOS 轮子是 universal2，但 Intel 机器
    # 已停售、构建时间翻倍，不再单独出 x86_64 包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests pymupdf
          pip install pyobjc-framework-Cocoa pyobjc-framework-UserNotifications

      - name: 生成应用图标（icns）
        run: |
          SRC="app/assets/smart-ylc@1024.png"
          ICONSET="build/$APP_NAME.iconset"
          mkdir -p "$ICONSET"
          # iconutil 要完整的 10 个条目：1x 与 @2x 各五档。之前只生成 1x 五档再补
          # 三档 @2x，漏了 16@2x 与 32@2x，Dock 和访达里的小图标会发虚。
          for spec in "16:16x16" "32:16x16@2x" "32:32x32" "64:32x32@2x" \
                      "128:128x128" "256:128x128@2x" "256:256x256" \
                      "512:256x256@2x" "512:512x512" "1024:512x512@2x"; do
            px="${spec%%:*}"; name="${spec##*:}"
            sips -z "$px" "$px" "$SRC" --out "$ICONSET/icon_${name}.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "build/$APP_NAME.icns"
          # 导出一次确认 icns 里真有图：空图标时 iconutil 也可能成功返回
          sips -g pixelWidth "build/$APP_NAME.icns" > /dev/null

      - name: PyInstaller 打包（.app）
        # 脚本负责资源、bundle id、版本，以及把产物改名成 dist/智慧团委.app
        run: python scripts/build.py

      - name: 校验应用图标
        run: |
          PLIST="dist/$APP_DISPLAY_NAME.app/Contents/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$PLIST" || true)
          if [ -z "$NAME" ]; then
            echo "::error::Info.plist 没有 CFBundleIconFile，.app 会用默认图标"
            exit 1
          fi
          ICON="dist/$APP_DISPLAY_NAME.app/Contents/Resources/$NAME"
          if [ ! -f "$ICON" ]; then
            echo "::error::找不到 $ICON"
            exit 1
          fi
          if ! cmp -s "build/$APP_NAME.icns" "$ICON"; then
            echo "::error::打包进 .app 的图标与 build/$APP_NAME.icns 不一致（回退成默认图标）"
            exit 1
          fi
          echo "应用图标已嵌入：$NAME ($(stat -f%z "$ICON") 字节)"

      - name: 制作 dmg 安装镜像
        run: |
          DMGROOT="dist/dmgroot"
          rm -rf "$DMGROOT"; mkdir -p "$DMGROOT"
          cp -R "dist/$APP_DISPLAY_NAME.app" "$DMGROOT/"
          # GPLv3 要求随二进制一并分发许可证全文
          cp LICENSE "$DMGROOT/许可证.txt"
          # 一次成型：不再「挂载—设卷图标—卸载—转换」。挂载后卸载在 runner 上会偶发
          # 「Resource busy」，整条发布就断在这步；卷图标只是 Finder 里的观感，
          # 应用图标本身在 .app 里，不受影响。
          # 产物名只用 ASCII：中文文件名在 Release 上会被剥成 "-macOS-arm64.dmg"，
          # 卷名与包内 .app 仍是「智慧团委」
          hdiutil create -volname "$APP_DISPLAY_NAME" -srcfolder "$DMGROOT" \
            -ov -format UDZO "dist/$APP_NAME-macOS-arm64.dmg" > /dev/null
          rm -rf "$DMGROOT"
          ls -lh "dist/$APP_NAME-macOS-arm64.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-macOS-arm64
          path: dist/${{ env.APP_NAME }}-macOS-arm64.dmg
          if-no-files-found: error

  build-windows:
    # Windows 10+ 64 位。32 位与 Win7 在下面的 build-windows-legacy 里，
    # 它们的依赖组合完全不同（老解释器、老 PyInstaller），分开跑不会互相拖累。
    runs-on: windows-latest
    env:
      ARTIFACT_SUFFIX: Win-x64
      PYTHON_BIT: "64"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 确认解释器架构
        run: python -c "import platform; print('python:', platform.architecture()[0], platform.machine()); assert platform.architecture()[0] == '64bit'"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests pymupdf

      - name: PyInstaller 打包（onedir）
        # 脚本输出固定为 dist/SmartYouth/智慧团委.exe，签名与 Inno Setup 都按这个路径取件
        run: python scripts/build.py
        shell: pwsh

      - name: 准备代码签名证书
        id: cert
        shell: pwsh
        env:
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:SIGNPATH_API_TOKEN) {
            # SignPath 模式：私钥在 SignPath 的 HSM 里，CI 不碰证书文件。
            # 本地 signtool 全部跳过，安装包整件交 signpath 步骤云端签名。
            "mode=signpath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "signtool=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "password=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "使用 SignPath 云端签名（正式 CA 证书，无需本地私钥）"
            exit 0
          }
          $pwd = ""
          if ($env:WIN_CERT_PFX_B64) {
            $bytes = [Convert]::FromBase64String($env:WIN_CERT_PFX_B64)
            [IO.File]::WriteAllBytes("cert.pfx", $bytes)
            $pwd = $env:WIN_CERT_PASSWORD
            $xc = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("cert.pfx", $pwd)
            "mode=secret" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "使用仓库 Secrets 中的证书签名（真实证书，终端不再提示未知发布者）"
          } else {
            $pwd = "LocalSign!" + ([guid]::NewGuid().ToString('N').Substring(0, 10))
            $xc = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=智慧团委 (SmartYouth)" `
              -KeyUsage DigitalSignature -FriendlyName "SmartYouth Code Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable `
              -NotAfter (Get-Date).AddYears(3) `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $sp = ConvertTo-SecureString -String $pwd -Force -AsPlainText
            Export-PfxCertificate -Cert $xc -FilePath "cert.pfx" -Password $sp | Out-Null
            "mode=selfsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "未配置证书 Secrets，已生成本次自签名证书"
          }
          # 导出公钥证书随包分发：内部分发时把它装进「受信任的根证书颁发机构」即可消除未知发布者。
          # 放在 dist/installer 里，与安装包同目录——upload-artifact 多路径时按公共父目录保留
          # 结构，分开放会让产物在 artifact 里多一层 installer/，Release 的 files 就对不上。
          New-Item -ItemType Directory -Force "dist/installer" | Out-Null
          Export-Certificate -Cert $xc -FilePath "dist/installer/SmartYouth-CodeSigning.cer" | Out-Null
          "password=$pwd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $candidates = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x86\signtool.exe"
          )
          $signtool = $null
          foreach ($pat in $candidates) {
            $found = Get-ChildItem $pat -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { $signtool = $found.FullName; break }
          }
          if ($signtool) {
            "signtool=$signtool" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "signtool: $signtool"
          } else {
            "signtool=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "找不到 signtool，跳过签名（安装包照常产出，但为未签名）"
          }

      - name: 签名主程序（本地证书）
        if: steps.cert.outputs.signtool != ''
        shell: pwsh
        env:
          SIGN_PWD: ${{ steps.cert.outputs.password }}
        run: |
          $st = "${{ steps.cert.outputs.signtool }}"
          $exe = "dist\SmartYouth\$($env:APP_DISPLAY_NAME).exe"
          & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "带时间戳签名失败，改试不带时间戳"
            & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 $exe
          }
          if ($LASTEXITCODE -ne 0) { Write-Warning "主程序签名失败，产物未签名" } else { Write-Host "主程序已签名" }

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq 'workflow_dispatch') { $ver = "1.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe（Inno Setup 未装好）" }
          # 自签名时多给安装包一个「信任证书」选项（安装时可选择提权把证书装进根存储）
          $defs = @("/DAppVersion=$ver", "/DArtifactSuffix=$env:ARTIFACT_SUFFIX",
                    "/DBitWidth=$env:PYTHON_BIT")
          if ('${{ steps.cert.outputs.mode }}' -eq 'selfsigned') { $defs += "/DSelfSigned=1" }
          & $iscc @defs "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译安装包失败" }
          Get-Item "dist\installer\SmartYouth-Windows-x64-setup.exe" | Select-Object Name, Length

      # SignPath 模式：整件安装包交云端签名（主 exe 不单独签——SmartScreen 看
      # 的是下载文件 setup.exe 的签名与信誉）。先传成 artifact 拿 id，再原地签回。
      - name: 上传待签名安装包
        id: unsigned-art
        if: steps.cert.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-windows-setup
          path: dist/installer/SmartYouth-Windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: SignPath 云端签名
        if: steps.cert.outputs.mode == 'signpath'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-art.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          # 默认会解包：签好的 exe 直接落在 output-artifact-directory 下
          output-artifact-directory: dist/signed

      - name: 校验并落位签名结果
        if: steps.cert.outputs.mode == 'signpath'
        shell: pwsh
        run: |
          $signed = Get-ChildItem "dist/signed" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath 返回目录里没有签好的 exe" }
          Move-Item -Force $signed.FullName "dist/installer/SmartYouth-Windows-x64-setup.exe"
          $sig = Get-AuthenticodeSignature "dist/installer/SmartYouth-Windows-x64-setup.exe"
          Write-Host "签名状态: $($sig.Status) / 签名者: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "签名状态异常: $($sig.Status)（$($sig.StatusMessage)）" }

      - name: 上传安装包（SignPath 已签名）
        if: steps.cert.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Windows
          path: dist/installer/SmartYouth-Windows-x64-setup.exe
          if-no-files-found: error

      - name: 签名安装包（本地证书）
        if: steps.cert.outputs.mode != 'signpath' && steps.cert.outputs.signtool != ''
        shell: pwsh
        env:
          SIGN_PWD: ${{ steps.cert.outputs.password }}
        run: |
          $st = "${{ steps.cert.outputs.signtool }}"
          $setup = "dist\installer\SmartYouth-Windows-x64-setup.exe"
          & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 $setup }
          if ($LASTEXITCODE -ne 0) { Write-Warning "安装包签名失败，产物未签名" } else { Write-Host "安装包已签名" }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Windows
          path: |
            dist/installer/SmartYouth-Windows-x64-setup.exe
            dist/installer/SmartYouth-CodeSigning.cer
          if-no-files-found: error

  build-windows-legacy:
    # 32 位与 Windows 7 专用。两条硬约束决定了这里的版本组合：
    #   1. Windows 7 上 CPython 只支持到 3.8（3.9 起要求 Win8+），所以 Win7 必须 3.8；
    #   2. PyInstaller 官方只保证 Win8+，5.x 的引导程序仍能在 Win7 上跑，
    #      6.x 起不再验证，因此 Win7 这组钉 5.13.2（最后支持 3.8 的 5.x）。
    # PyQt5 / PyQtWebEngine / PyMuPDF / numpy / Pillow 都有对应 win32 与 cp38 轮子，
    # 32 位产物的依赖是齐的。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10+ 32 位：解释器仍是 3.11，只是 32 位，用新版 PyInstaller
          - suffix: Win-x86
            bit: "32"
            python: "3.11"
            pyinstaller: "pyinstaller"
            pip: '"PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests pymupdf'
          # Windows 7 64 位
          - suffix: Win7-x64
            bit: "64"
            python: "3.8"
            pyinstaller: "pyinstaller==5.13.2"
            # 3.8 上必须钉版本：新版 PyMuPDF 要 >=3.10、numpy 2.x 要 >=3.9
            pip: '"PyQt5==5.15.11" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine==5.15.7" pypdf "pillow<11" openpyxl requests "pymupdf==1.24.11" "numpy<1.25"'
          # Windows 7 32 位
          - suffix: Win7-x86
            bit: "32"
            python: "3.8"
            pyinstaller: "pyinstaller==5.13.2"
            pip: '"PyQt5==5.15.11" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine==5.15.7" pypdf "pillow<11" openpyxl requests "pymupdf==1.24.11" "numpy<1.25"'
    env:
      ARTIFACT_SUFFIX: ${{ matrix.suffix }}
      PYTHON_BIT: ${{ matrix.bit }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.bit == '32' && 'x86' || 'x64' }}

      - name: 确认解释器版本与架构
        shell: pwsh
        run: |
          python -c "import platform,sys;print('python:',platform.python_version(),platform.architecture()[0],platform.machine())"
          python -c "import platform;assert platform.architecture()[0]=='${{ matrix.bit }}bit'"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.pyinstaller }}
          python -m pip install ${{ matrix.pip }}
          python -m pip list

      - name: PyInstaller 打包（onedir）
        run: python scripts/build.py
        shell: pwsh

      - name: 冒烟检查（冻结产物真能起窗口）
        # 分析期 import 通过不代表能跑：缺 DLL、缺 Qt 插件都在这一步暴露。
        # --smoke-test 会构造主窗口后自行退出，HOME 指到临时目录不碰真实配置。
        shell: pwsh
        run: |
          $env:HOME = Join-Path $env:TEMP "smoke-${{ matrix.suffix }}"
          $env:USERPROFILE = $env:HOME
          $out = & "dist\SmartYouth\$($env:APP_DISPLAY_NAME).exe" --smoke-test 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "冻结产物冒烟失败（退出码 $LASTEXITCODE）" }
          if (-not ($out -match "SMOKE OK")) { throw "冒烟输出里没有 SMOKE OK" }

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq 'workflow_dispatch') { $ver = "1.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe（Inno Setup 未装好）" }
          & $iscc "/DAppVersion=$ver" "/DArtifactSuffix=$env:ARTIFACT_SUFFIX" `
                  "/DBitWidth=$env:PYTHON_BIT" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译安装包失败" }
          Get-Item "dist\installer\SmartYouth-$($env:ARTIFACT_SUFFIX)-setup.exe" |
            Select-Object Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.suffix }}
          path: dist/installer/SmartYouth-${{ matrix.suffix }}-setup.exe
          if-no-files-found: error

  build-linux:
    # 只在 x86_64 出 .deb：ubuntu-22.04 的 glibc 2.35 比 24.04 更旧，
    # 编出来的包能装的发行版范围更大（deb 不校验 glibc 下限，兼容全靠构建机）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装系统依赖
        # PyInstaller 分析阶段要真的 import PyQt5，缺 libGL/libEGL 直接崩；
        # Qt xcb 平台插件的运行时依赖也一并列进 deb 的 Depends；xvfb 供冒烟检查。
        # libxkbcommon-x11-0 / libxcb-xkb1 是 Qt6XcbQpa 的硬依赖（PyInstaller 只带
        # Qt6XcbQpa 本身，不带这两个系统库），缺了 xcb 插件报 "found but could not load"。
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            fontconfig libglib2.0-0 libx11-6 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxcb-xkb1 libxcb-xinput0 libsm6 libice6 \
            libxrender1 libxi6

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PyQt5>=5.15" "PyQt-Fluent-Widgets>=1.11" "PyQtWebEngine>=5.15" pypdf pillow openpyxl requests pymupdf

      - name: PyInstaller 打包（onedir）
        # 脚本在 Linux 上输出 dist/SmartYouth/，并把图标铺进 share/icons/hicolor
        run: python scripts/build.py

      - name: 冒烟检查（Xvfb 真实 X11）
        # 分析期 import 过了不算数：这里验证冻结产物真能构造主窗口。
        # 必须用 Xvfb 而不是 QT_QPA_PLATFORM=offscreen——无边框窗口初始化
        # 在没有真实窗口系统时会段错误。浏览器页的 Chromium 沙箱在 CI root
        # 环境起不来，用 QTWEBENGINE_CHROMIUM_FLAGS 关掉（只影响这次冒烟）。
        # 先跑 ldd 诊断：xcb 插件报 "found but could not load" 时，Qt 只说
        # 插件名不说缺哪个库，这里直接把 not found 的 .so 列进日志。
        run: |
          XCB=$(find dist/SmartYouth -name "libqxcb.so" -path "*platforms*" | head -1)
          echo "xcb plugin: $XCB"
          ldd "$XCB" 2>/dev/null | grep "not found" || echo "（xcb 插件依赖完整）"
          QT_DEBUG_PLUGINS=1 QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox" \
            timeout 90 xvfb-run -a dist/SmartYouth/SmartYouth --smoke-test
          echo "冻结产物冒烟通过"

      - name: 制作 .deb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$VER" ] && VER="0.0.0"   # workflow_dispatch 时没 tag
          PKG="dist/deb"
          rm -rf "$PKG"; mkdir -p \
            "$PKG/DEBIAN" \
            "$PKG/opt/SmartYouth" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/512x512/apps" \
            "$PKG/usr/bin"
          cp -R dist/SmartYouth/. "$PKG/opt/SmartYouth/"
          # dist/SmartYouth/share 是 build.py 铺的 hicolor 图标，deb 里装到系统图标路径
          cp "$PKG/opt/SmartYouth/share/icons/hicolor/512x512/apps/SmartYouth.png" \
            "$PKG/usr/share/icons/hicolor/512x512/apps/" 2>/dev/null || \
            cp app/assets/smart-ylc@512.png "$PKG/usr/share/icons/hicolor/512x512/apps/SmartYouth.png"
          # 不用 heredoc：YAML block scalar 里 `<<EOF` 的结束标记带缩义就永不闭合，
          # 内容行前导空格也会污染 desktop/control 的键值解析，printf 逐行写最稳。
          printf '[Desktop Entry]\nType=Application\nName=智慧团委\nName[en]=SmartYouth\nExec=/opt/SmartYouth/SmartYouth\nIcon=SmartYouth\nTerminal=false\nCategories=Office;\nComment=多支部账号一屏管理\n' \
            > "$PKG/usr/share/applications/SmartYouth.desktop"
          ln -sf /opt/SmartYouth/SmartYouth "$PKG/usr/bin/smartyouth"
          SIZE=$(du -sk "$PKG/opt/SmartYouth" | cut -f1)
          printf 'Package: smartyouth\nVersion: %s\nArchitecture: amd64\nInstalled-Size: %s\nMaintainer: AnkoQAQ <ismsmallpigpig@outlook.com>\nDepends: libegl1, libgl1, libxkbcommon0, libdbus-1-3, fontconfig, libglib2.0-0, libx11-6, libxcb1, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xinerama0, libxkbcommon-x11-0, libxcb-xkb1, libxcb-xinput0, libsm6, libice6, libxrender1, libxi6, libnss3, libnspr4, libxcomposite1, libxdamage1, libxfixes3, libxtst6, libasound2, libcairo2, libpango-1.0-0, libatspi2.0-0, libcups2\nSection: utils\nPriority: optional\nDescription: 智慧团委助手（Smart-YLC helper）\n 多支部账号一屏管理：档案上传、组织状况、站内信与数据导出。\n Qt/PyQt5 运行时已随包携带，安装到 /opt/SmartYouth。\n' \
            "$VER" "$SIZE" > "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG" \
            "dist/$APP_NAME-Linux-x64.deb"
          ls -lh "dist/$APP_NAME-Linux-x64.deb"
          dpkg-deb -c "dist/$APP_NAME-Linux-x64.deb" | head -5

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Linux-x64
          path: dist/${{ env.APP_NAME }}-Linux-x64.deb
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows, build-windows-legacy, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 组合 Release 说明（下载信息 + CHANGELOG）
        # 说明直接贴变更日志，不用 GitHub 自动生成的 “What's Changed”
        run: |
          {
            echo "## 下载"
            echo "- **macOS（Apple Silicon / M 系列）**：\`SmartYouth-macOS-arm64.dmg\`（挂载后是「智慧团委.app」）"
            echo "- **Windows 10/11（64 位）**：\`SmartYouth-Windows-x64-setup.exe\`（每用户安装，不需要管理员权限、不弹 UAC）"
            echo "- **Windows 10/11（32 位）**：\`SmartYouth-Win-x86-setup.exe\`"
            echo "- **Windows 7（64 位）**：\`SmartYouth-Win7-x64-setup.exe\`"
            echo "- **Windows 7（32 位）**：\`SmartYouth-Win7-x86-setup.exe\`"
            echo "- **Linux（x86_64）**：\`SmartYouth-Linux-x64.deb\`（装好后命令 \`smartyouth\` 或应用列表里的「智慧团委」；面向 Ubuntu 22.04+/Debian 12+）"
            echo
            echo "> macOS 仅支持 Apple Silicon。Windows 按系统与位数选包：Win10/11 用 Win-x64 或 Win-x86，Windows 7 用 Win7-x64 或 Win7-x86（Win7 包基于 Python 3.8，无法使用 Win10/11 包）。安装包用英文名（GitHub 下载文件名不支持中文），装好后的应用名是「智慧团委」。"
            echo
            echo "首次运行：macOS 若提示「无法验证开发者」，右键 → 打开，或执行 \`xattr -cr /Applications/智慧团委.app\`；"
            echo "Windows 双击安装包，SmartScreen 提示时点「更多信息 → 仍要运行」。"
            echo
            echo "Windows 若附带 \`SmartYouth-CodeSigning.cer\`，内部分发可把它装进「受信任的根证书颁发机构」以消除「未知发布者」。"
            echo
            echo "---"
            echo
            # 只贴本次版本的条目：CHANGELOG 攒了多个版本后，整份贴出来会淹没本次改动
            awk '/^## v/{n++} n==1' CHANGELOG.md
          } > release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          generate_release_notes: false
          # 少一个产物就让任务红掉，避免静默发出残缺 Release
          fail_on_unmatched_files: true
          # 用通配而不是写死层级：artifact 内是否多一层目录取决于上传时给的路径，
          # 写死会让一个目录调整就整条发布失败。通配仍受 fail_on_unmatched_files 约束，
          # 少哪个产物照样红。
          files: |
            artifacts/**/*.dmg
            artifacts/**/*setup.exe
            artifacts/**/*.cer
            artifacts/**/*.deb
