name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: 生成应用图标（icns）
        run: |
          mkdir -p build/SmartYouth.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size app/assets/smart-ylc@512.png \
              --out build/SmartYouth.iconset/icon_${size}x${size}.png > /dev/null
          done
          cp app/assets/smart-ylc@1024.png build/SmartYouth.iconset/icon_512x512@2x.png
          cp build/SmartYouth.iconset/icon_256x256.png build/SmartYouth.iconset/icon_256x256@2x.png
          cp build/SmartYouth.iconset/icon_128x128.png build/SmartYouth.iconset/icon_128x128@2x.png
          iconutil -c icns build/SmartYouth.iconset -o build/icon.icns

      - name: PyInstaller 打包（.app）
        run: |
          pyinstaller --noconfirm --clean \
            --windowed --name SmartYouth \
            --collect-all qfluentwidgets \
            --icon build/icon.icns \
            --add-data "app/assets:assets" \
            main.py

      - name: 制作 dmg 安装镜像
        run: |
          hdiutil create -volname "SmartYouth" \
            -srcfolder "dist/SmartYouth.app" \
            -ov -format UDZO "dist/SmartYouth-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartYouth-macOS
          path: dist/SmartYouth-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: PyInstaller 打包（单文件 exe）
        run: |
          pyinstaller --noconfirm --clean `
            --onefile --windowed --name SmartYouth `
            --collect-all qfluentwidgets `
            --icon app/assets/smart-ylc.ico `
            --add-data "app/assets;assets" `
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SmartYouth-Windows
          path: dist/SmartYouth.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 Release（notes 由 GitHub bot 自动生成）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 下载
            - **macOS**：`SmartYouth-macOS.dmg`（拖入 Applications 即可安装）
            - **Windows**：`SmartYouth-Windows.exe`（单文件版，双击运行）

            ## 首次运行说明
            - **macOS**：应用未做签名与公证，首次打开若提示「无法验证开发者」，
              请在访达中**右键 → 打开**，或终端执行：
              `xattr -cr /Applications/SmartYouth.app`
            - **Windows**：同样无代码签名，SmartScreen 可能提示「已保护你的电脑」，
              点「更多信息 → 仍要运行」。

            完整变更列表见下方自动生成的更新日志（由 GitHub bot 生成）。
          files: |
            artifacts/SmartYouth-macOS/SmartYouth-macOS.dmg
            artifacts/SmartYouth-Windows/SmartYouth.exe
