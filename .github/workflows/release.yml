name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: SmartYouth
  BUNDLE_ID: com.smallylc.smartyouth

jobs:
  build-macos:
    strategy:
      # 一个架构失败不连坐另一个，Intel 和 arm64 各自出包
      fail-fast: false
      matrix:
        include:
          # macos-15：Apple Silicon（M 系列）
          # macos-15-intel：x86_64。原来的 macos-13 已于 2025-12-04 退役，
          # macos-15-intel 是 GitHub 目前唯一还在的 Intel 镜像（可用到 2027-08）
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: 生成应用图标（icns）
        run: |
          SRC="app/assets/smart-ylc@1024.png"
          ICONSET="build/SmartYouth.iconset"
          mkdir -p "$ICONSET"
          # iconutil 要完整的 10 个条目：1x 与 @2x 各五档。之前只生成 1x 五档再补
          # 三档 @2x，漏了 16@2x 与 32@2x，Dock 和访达里的小图标会发虚。
          for spec in "16:16x16" "32:16x16@2x" "32:32x32" "64:32x32@2x" \
                      "128:128x128" "256:128x128@2x" "256:256x256" \
                      "512:256x256@2x" "512:512x512" "1024:512x512@2x"; do
            px="${spec%%:*}"; name="${spec##*:}"
            sips -z "$px" "$px" "$SRC" --out "$ICONSET/icon_${name}.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o build/icon.icns

      - name: PyInstaller 打包（.app）
        run: |
          pyinstaller --noconfirm --clean \
            --windowed --name "$APP_NAME" \
            --osx-bundle-identifier "$BUNDLE_ID" \
            --collect-all qfluentwidgets \
            --icon build/icon.icns \
            --add-data "app/assets:assets" \
            main.py

      - name: 制作 dmg 安装镜像
        run: |
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "dist/$APP_NAME.app" \
            -ov -format UDZO "dist/$APP_NAME-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-${{ matrix.arch }}
          path: dist/${{ env.APP_NAME }}-macOS-${{ matrix.arch }}.dmg

  build-windows:
    # windows-latest 自带 x86_64 工具链，打出的就是 64 位 Windows 版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: PyInstaller 打包（单文件 exe）
        run: |
          pyinstaller --noconfirm --clean `
            --onefile --windowed --name $env:APP_NAME `
            --collect-all qfluentwidgets `
            --icon app/assets/smart-ylc.ico `
            --add-data "app/assets;assets" `
            main.py

      - name: 重命名 exe 标明架构
        run: Move-Item "dist/$env:APP_NAME.exe" "dist/$env:APP_NAME-Windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows
          path: dist/${{ env.APP_NAME }}-Windows-x64.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 Release（notes 由 GitHub bot 自动生成）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 下载
            - **macOS（Apple Silicon / M 系列）**：`SmartYouth-macOS-arm64.dmg`
            - **macOS（Intel）**：`SmartYouth-macOS-x86_64.dmg`
            - **Windows（64 位）**：`SmartYouth-Windows-x64.exe`（单文件版，双击运行）

            拿不准 Mac 的芯片型号时，点左上角苹果菜单 →「关于本机」：
            「芯片」显示 Apple M 系列选 arm64，显示处理器（Intel）选 x86_64。

            ## 首次运行说明
            - **macOS**：应用未做签名与公证，首次打开若提示「无法验证开发者」，
              请在访达中**右键 → 打开**，或终端执行：
              `xattr -cr /Applications/SmartYouth.app`
            - **Windows**：同样无代码签名，SmartScreen 可能提示「已保护你的电脑」，
              点「更多信息 → 仍要运行」。

            完整变更列表见下方自动生成的更新日志（由 GitHub bot 生成）。
          files: |
            artifacts/SmartYouth-macOS-arm64/SmartYouth-macOS-arm64.dmg
            artifacts/SmartYouth-macOS-x86_64/SmartYouth-macOS-x86_64.dmg
            artifacts/SmartYouth-Windows/SmartYouth-Windows-x64.exe
