name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  # Windows runner 的 Python 默认按 locale 编码写 stdout（cp1252），
  # 打印含中文的路径会 UnicodeEncodeError；统一按 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 内部标识：bundle id、可执行文件名保持 ASCII，避免签名/路径上的麻烦
  APP_NAME: SmartYouth
  # 用户看到的名字：.app / .exe / 安装镜像里的显示名
  APP_DISPLAY_NAME: 智慧团委
  BUNDLE_ID: com.smallylc.smartyouth

jobs:
  build-macos:
    # 只出 Apple Silicon：PySide6 6.12 的 macOS 轮子是 universal2，但 Intel 机器
    # 已停售、构建时间翻倍，不再单独出 x86_64 包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf
          pip install pyobjc-framework-Cocoa pyobjc-framework-UserNotifications

      - name: 生成应用图标（icns）
        run: |
          SRC="app/assets/smart-ylc@1024.png"
          ICONSET="build/$APP_NAME.iconset"
          mkdir -p "$ICONSET"
          # iconutil 要完整的 10 个条目：1x 与 @2x 各五档。之前只生成 1x 五档再补
          # 三档 @2x，漏了 16@2x 与 32@2x，Dock 和访达里的小图标会发虚。
          for spec in "16:16x16" "32:16x16@2x" "32:32x32" "64:32x32@2x" \
                      "128:128x128" "256:128x128@2x" "256:256x256" \
                      "512:256x256@2x" "512:512x512" "1024:512x512@2x"; do
            px="${spec%%:*}"; name="${spec##*:}"
            sips -z "$px" "$px" "$SRC" --out "$ICONSET/icon_${name}.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "build/$APP_NAME.icns"
          # 导出一次确认 icns 里真有图：空图标时 iconutil 也可能成功返回
          sips -g pixelWidth "build/$APP_NAME.icns" > /dev/null

      - name: PyInstaller 打包（.app）
        # 脚本负责资源、bundle id、版本，以及把产物改名成 dist/智慧团委.app
        run: python scripts/build.py

      - name: 校验应用图标
        run: |
          PLIST="dist/$APP_DISPLAY_NAME.app/Contents/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$PLIST" || true)
          if [ -z "$NAME" ]; then
            echo "::error::Info.plist 没有 CFBundleIconFile，.app 会用默认图标"
            exit 1
          fi
          ICON="dist/$APP_DISPLAY_NAME.app/Contents/Resources/$NAME"
          if [ ! -f "$ICON" ]; then
            echo "::error::找不到 $ICON"
            exit 1
          fi
          if ! cmp -s "build/$APP_NAME.icns" "$ICON"; then
            echo "::error::打包进 .app 的图标与 build/$APP_NAME.icns 不一致（回退成默认图标）"
            exit 1
          fi
          echo "应用图标已嵌入：$NAME ($(stat -f%z "$ICON") 字节)"

      - name: 制作 dmg 安装镜像
        run: |
          DMGROOT="dist/dmgroot"
          rm -rf "$DMGROOT"; mkdir -p "$DMGROOT"
          cp -R "dist/$APP_DISPLAY_NAME.app" "$DMGROOT/"
          # GPLv3 要求随二进制一并分发许可证全文
          cp LICENSE "$DMGROOT/许可证.txt"
          # 一次成型：不再「挂载—设卷图标—卸载—转换」。挂载后卸载在 runner 上会偶发
          # 「Resource busy」，整条发布就断在这步；卷图标只是 Finder 里的观感，
          # 应用图标本身在 .app 里，不受影响。
          # 产物名只用 ASCII：中文文件名在 Release 上会被剥成 "-macOS-arm64.dmg"，
          # 卷名与包内 .app 仍是「智慧团委」
          hdiutil create -volname "$APP_DISPLAY_NAME" -srcfolder "$DMGROOT" \
            -ov -format UDZO "dist/$APP_NAME-macOS-arm64.dmg" > /dev/null
          rm -rf "$DMGROOT"
          ls -lh "dist/$APP_NAME-macOS-arm64.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-macOS-arm64
          path: dist/${{ env.APP_NAME }}-macOS-arm64.dmg
          if-no-files-found: error

  build-windows:
    # 只出 64 位：PySide6 6.x 没有 win32（32 位）轮子，无法编译 32 位程序
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 确认解释器架构
        run: python -c "import platform; print('python:', platform.architecture()[0], platform.machine()); assert platform.architecture()[0] == '64bit'"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: PyInstaller 打包（onedir）
        # 脚本输出固定为 dist/SmartYouth/智慧团委.exe，签名与 Inno Setup 都按这个路径取件
        run: python scripts/build.py
        shell: pwsh

      - name: 准备代码签名证书
        id: cert
        shell: pwsh
        env:
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pwd = ""
          if ($env:WIN_CERT_PFX_B64) {
            $bytes = [Convert]::FromBase64String($env:WIN_CERT_PFX_B64)
            [IO.File]::WriteAllBytes("cert.pfx", $bytes)
            $pwd = $env:WIN_CERT_PASSWORD
            $xc = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("cert.pfx", $pwd)
            "mode=secret" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "使用仓库 Secrets 中的证书签名（真实证书，终端不再提示未知发布者）"
          } else {
            $pwd = "LocalSign!" + ([guid]::NewGuid().ToString('N').Substring(0, 10))
            $xc = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=智慧团委 (SmartYouth)" `
              -KeyUsage DigitalSignature -FriendlyName "SmartYouth Code Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable `
              -NotAfter (Get-Date).AddYears(3) `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $sp = ConvertTo-SecureString -String $pwd -Force -AsPlainText
            Export-PfxCertificate -Cert $xc -FilePath "cert.pfx" -Password $sp | Out-Null
            "mode=selfsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "未配置证书 Secrets，已生成本次自签名证书"
          }
          # 导出公钥证书随包分发：内部分发时把它装进「受信任的根证书颁发机构」即可消除未知发布者。
          # 放在 dist/installer 里，与安装包同目录——upload-artifact 多路径时按公共父目录保留
          # 结构，分开放会让产物在 artifact 里多一层 installer/，Release 的 files 就对不上。
          New-Item -ItemType Directory -Force "dist/installer" | Out-Null
          Export-Certificate -Cert $xc -FilePath "dist/installer/SmartYouth-CodeSigning.cer" | Out-Null
          "password=$pwd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $candidates = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x86\signtool.exe"
          )
          $signtool = $null
          foreach ($pat in $candidates) {
            $found = Get-ChildItem $pat -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { $signtool = $found.FullName; break }
          }
          if ($signtool) {
            "signtool=$signtool" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "signtool: $signtool"
          } else {
            "signtool=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "找不到 signtool，跳过签名（安装包照常产出，但为未签名）"
          }

      - name: 签名主程序
        if: steps.cert.outputs.signtool != ''
        shell: pwsh
        env:
          SIGN_PWD: ${{ steps.cert.outputs.password }}
        run: |
          $st = "${{ steps.cert.outputs.signtool }}"
          $exe = "dist\SmartYouth\$($env:APP_DISPLAY_NAME).exe"
          & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "带时间戳签名失败，改试不带时间戳"
            & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 $exe
          }
          if ($LASTEXITCODE -ne 0) { Write-Warning "主程序签名失败，产物未签名" } else { Write-Host "主程序已签名" }

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq 'workflow_dispatch') { $ver = "1.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe（Inno Setup 未装好）" }
          # 自签名时多给安装包一个「信任证书」选项（安装时可选择提权把证书装进根存储）
          $defs = @("/DAppVersion=$ver")
          if ('${{ steps.cert.outputs.mode }}' -eq 'selfsigned') { $defs += "/DSelfSigned=1" }
          & $iscc @defs "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译安装包失败" }
          Get-Item "dist\installer\SmartYouth-Windows-x64-setup.exe" | Select-Object Name, Length

      - name: 签名安装包
        if: steps.cert.outputs.signtool != ''
        shell: pwsh
        env:
          SIGN_PWD: ${{ steps.cert.outputs.password }}
        run: |
          $st = "${{ steps.cert.outputs.signtool }}"
          $setup = "dist\installer\SmartYouth-Windows-x64-setup.exe"
          & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { & $st sign /f cert.pfx /p $env:SIGN_PWD /fd SHA256 $setup }
          if ($LASTEXITCODE -ne 0) { Write-Warning "安装包签名失败，产物未签名" } else { Write-Host "安装包已签名" }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Windows
          path: |
            dist/installer/SmartYouth-Windows-x64-setup.exe
            dist/installer/SmartYouth-CodeSigning.cer
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 组合 Release 说明（下载信息 + CHANGELOG）
        # 说明直接贴变更日志，不用 GitHub 自动生成的 “What's Changed”
        run: |
          {
            echo "## 下载"
            echo "- **macOS（Apple Silicon / M 系列）**：\`SmartYouth-macOS-arm64.dmg\`（挂载后是「智慧团委.app」）"
            echo "- **Windows（64 位）**：\`SmartYouth-Windows-x64-setup.exe\`（每用户安装，不需要管理员权限、不弹 UAC）"
            echo
            echo "> 仅支持 Apple Silicon；Windows 仅 64 位。安装包用英文名（GitHub 下载文件名不支持中文），装好后的应用名是「智慧团委」。"
            echo
            echo "首次运行：macOS 若提示「无法验证开发者」，右键 → 打开，或执行 \`xattr -cr /Applications/智慧团委.app\`；"
            echo "Windows 双击安装包，SmartScreen 提示时点「更多信息 → 仍要运行」。"
            echo
            echo "Windows 若附带 \`SmartYouth-CodeSigning.cer\`，内部分发可把它装进「受信任的根证书颁发机构」以消除「未知发布者」。"
            echo
            echo "---"
            echo
            # 只贴本次版本的条目：CHANGELOG 攒了多个版本后，整份贴出来会淹没本次改动
            awk '/^## v/{n++} n==1' CHANGELOG.md
          } > release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          generate_release_notes: false
          # 少一个产物就让任务红掉，避免静默发出残缺 Release
          fail_on_unmatched_files: true
          # 用通配而不是写死层级：artifact 内是否多一层目录取决于上传时给的路径，
          # 写死会让一个目录调整就整条发布失败。通配仍受 fail_on_unmatched_files 约束，
          # 少哪个产物照样红。
          files: |
            artifacts/**/*.dmg
            artifacts/**/*setup.exe
            artifacts/**/*.cer
