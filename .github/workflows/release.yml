name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          # macos-14 是 Apple Silicon，macos-13 是最后一版 Intel 机器
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: 生成应用图标（icns）
        run: |
          mkdir -p build/SmartYouth.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size app/assets/smart-ylc@512.png \
              --out build/SmartYouth.iconset/icon_${size}x${size}.png > /dev/null
          done
          cp app/assets/smart-ylc@1024.png build/SmartYouth.iconset/icon_512x512@2x.png
          cp build/SmartYouth.iconset/icon_256x256.png build/SmartYouth.iconset/icon_256x256@2x.png
          cp build/SmartYouth.iconset/icon_128x128.png build/SmartYouth.iconset/icon_128x128@2x.png
          iconutil -c icns build/SmartYouth.iconset -o build/icon.icns

      - name: PyInstaller 打包（.app）
        run: |
          pyinstaller --noconfirm --clean \
            --windowed --name SmartYouth \
            --collect-all qfluentwidgets \
            --icon build/icon.icns \
            --add-data "app/assets:assets" \
            main.py

      - name: 制作 dmg 安装镜像
        run: |
          hdiutil create -volname "SmartYouth" \
            -srcfolder "dist/SmartYouth.app" \
            -ov -format UDZO "dist/SmartYouth-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartYouth-macOS-${{ matrix.arch }}
          path: dist/SmartYouth-macOS-${{ matrix.arch }}.dmg

  build-windows:
    # windows-latest 自带 x86_64（Intel/AMD 64 位）工具链，打出的就是 x86 版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: PyInstaller 打包（单文件 exe）
        run: |
          pyinstaller --noconfirm --clean `
            --onefile --windowed --name SmartYouth `
            --collect-all qfluentwidgets `
            --icon app/assets/smart-ylc.ico `
            --add-data "app/assets;assets" `
            main.py

      - name: 重命名 exe 标明架构
        run: Move-Item dist/SmartYouth.exe dist/SmartYouth-Windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SmartYouth-Windows
          path: dist/SmartYouth-Windows-x64.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 Release（notes 由 GitHub bot 自动生成）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 下载
            - **macOS（Apple Silicon / M 系列）**：`SmartYouth-macOS-arm64.dmg`
            - **macOS（Intel）**：`SmartYouth-macOS-x86_64.dmg`
            - **Windows（64 位）**：`SmartYouth-Windows-x64.exe`（单文件版，双击运行）

            拿不准 Mac 的芯片型号时，点左上角苹果菜单 →「关于本机」：
            「芯片」显示 Apple M 系列选 arm64，显示处理器（Intel）选 x86_64。

            ## 首次运行说明
            - **macOS**：应用未做签名与公证，首次打开若提示「无法验证开发者」，
              请在访达中**右键 → 打开**，或终端执行：
              `xattr -cr /Applications/SmartYouth.app`
            - **Windows**：同样无代码签名，SmartScreen 可能提示「已保护你的电脑」，
              点「更多信息 → 仍要运行」。

            完整变更列表见下方自动生成的更新日志（由 GitHub bot 生成）。
          files: |
            artifacts/SmartYouth-macOS-arm64/SmartYouth-macOS-arm64.dmg
            artifacts/SmartYouth-macOS-x86_64/SmartYouth-macOS-x86_64.dmg
            artifacts/SmartYouth-Windows/SmartYouth-Windows-x64.exe
