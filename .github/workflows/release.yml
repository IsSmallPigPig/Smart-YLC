name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  # 内部标识：bundle id、可执行文件名保持 ASCII，避免签名/路径上的麻烦
  APP_NAME: SmartYouth
  # 用户看到的名字：.app / .exe / 安装镜像里的显示名
  APP_DISPLAY_NAME: 智慧团委
  BUNDLE_ID: com.smallylc.smartyouth

jobs:
  build-macos:
    # 只出 Apple Silicon：PySide6 6.12 的 macOS 轮子是 universal2，但 Intel 机器
    # 已停售、构建时间翻倍，不再单独出 x86_64 包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: 生成应用图标（icns）
        run: |
          SRC="app/assets/smart-ylc@1024.png"
          ICONSET="build/$APP_NAME.iconset"
          mkdir -p "$ICONSET"
          # iconutil 要完整的 10 个条目：1x 与 @2x 各五档。之前只生成 1x 五档再补
          # 三档 @2x，漏了 16@2x 与 32@2x，Dock 和访达里的小图标会发虚。
          for spec in "16:16x16" "32:16x16@2x" "32:32x32" "64:32x32@2x" \
                      "128:128x128" "256:128x128@2x" "256:256x256" \
                      "512:256x256@2x" "512:512x512" "1024:512x512@2x"; do
            px="${spec%%:*}"; name="${spec##*:}"
            sips -z "$px" "$px" "$SRC" --out "$ICONSET/icon_${name}.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "build/$APP_NAME.icns"
          # 导出一次确认 icns 里真有图：空图标时 iconutil 也可能成功返回
          sips -g pixelWidth "build/$APP_NAME.icns" > /dev/null

      - name: PyInstaller 打包（.app）
        run: |
          pyinstaller --noconfirm --clean \
            --windowed --name "$APP_NAME" \
            --osx-bundle-identifier "$BUNDLE_ID" \
            --collect-all qfluentwidgets \
            --icon "build/$APP_NAME.icns" \
            --add-data "app/assets:assets" \
            main.py

      - name: 改成中文应用名
        run: |
          # Finder / 启动台显示的是 .app 的文件名，所以直接改包名；
          # 包内可执行文件名保持 ASCII，不影响签名与自启动路径
          mv "dist/$APP_NAME.app" "dist/$APP_DISPLAY_NAME.app"
          PLIST="dist/$APP_DISPLAY_NAME.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_DISPLAY_NAME" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleName string $APP_DISPLAY_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_DISPLAY_NAME" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_DISPLAY_NAME" "$PLIST"

      - name: 校验应用图标
        run: |
          PLIST="dist/$APP_DISPLAY_NAME.app/Contents/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$PLIST" || true)
          if [ -z "$NAME" ]; then
            echo "::error::Info.plist 没有 CFBundleIconFile，.app 会用默认图标"
            exit 1
          fi
          ICON="dist/$APP_DISPLAY_NAME.app/Contents/Resources/$NAME"
          if [ ! -f "$ICON" ]; then
            echo "::error::找不到 $ICON"
            exit 1
          fi
          if ! cmp -s "build/$APP_NAME.icns" "$ICON"; then
            echo "::error::打包进 .app 的图标与 build/$APP_NAME.icns 不一致（回退成 PyInstaller 默认图标）"
            exit 1
          fi
          echo "应用图标已嵌入：$NAME ($(stat -f%z "$ICON") 字节)"

      - name: 制作 dmg 安装镜像
        run: |
          DMGROOT="dist/dmgroot"
          rm -rf "$DMGROOT"; mkdir -p "$DMGROOT"
          cp -R "dist/$APP_DISPLAY_NAME.app" "$DMGROOT/"
          # GPLv3 要求随二进制一并分发许可证全文
          cp LICENSE "$DMGROOT/许可证.txt"
          # 卷图标：不设的话挂载后的磁盘显示成通用磁盘图标，看不到应用 LOGO
          cp "build/$APP_NAME.icns" "$DMGROOT/.VolumeIcon.icns"
          RW="dist/$APP_NAME-rw.dmg"
          hdiutil create -volname "$APP_DISPLAY_NAME" -srcfolder "$DMGROOT" \
            -ov -format UDRW "$RW" > /dev/null
          MOUNT="/tmp/$APP_NAME-vol"
          hdiutil attach "$RW" -nobrowse -mountpoint "$MOUNT" > /dev/null
          if command -v SetFile > /dev/null; then
            SetFile -a C "$MOUNT"
          else
            echo "::warning::SetFile 不可用，卷图标可能不生效"
          fi
          hdiutil detach "$MOUNT" > /dev/null
          # 产物名只用 ASCII：中文文件名在 Release 上会被剥成 "-macOS-arm64.dmg"，
          # 卷名与包内 .app 仍是「智慧团委」
          hdiutil convert "$RW" -format UDZO \
            -o "dist/$APP_NAME-macOS-arm64.dmg" > /dev/null
          rm -rf "$RW" "$DMGROOT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-macOS-arm64
          path: dist/${{ env.APP_NAME }}-macOS-arm64.dmg
          if-no-files-found: error

  build-windows:
    # 只出 64 位：PySide6 6.x 没有 win32（32 位）轮子，无法编译 32 位程序
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 确认解释器架构
        run: python -c "import platform; print('python:', platform.architecture()[0], platform.machine()); assert platform.architecture()[0] == '64bit'"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "PySide6>=6.12" "PySide6-Fluent-Widgets>=1.11" pypdf pillow openpyxl requests pymupdf

      - name: PyInstaller 打包（单文件 exe）
        run: |
          pyinstaller --noconfirm --clean `
            --onefile --windowed --name $env:APP_NAME `
            --collect-all qfluentwidgets `
            --icon app/assets/smart-ylc.ico `
            --add-data "app/assets;assets" `
            main.py

      - name: 改成中文应用名并打包
        run: |
          $target = "dist/${env:APP_DISPLAY_NAME}.exe"
          Move-Item "dist/${env:APP_NAME}.exe" $target
          Get-Item $target | Select-Object Name, Length
          # 资源名不能带中文（GitHub 会把中文剥掉，只剩 "-Windows-x64.exe"），
          # 所以对外用 ASCII 的 zip，解压出来的程序仍叫「智慧团委.exe」
          python -c "import os, zipfile; d='dist'; n=os.environ['APP_DISPLAY_NAME']; z=zipfile.ZipFile(os.path.join(d, os.environ['APP_NAME']+'-Windows-x64.zip'), 'w', zipfile.ZIP_DEFLATED); z.write(os.path.join(d, n+'.exe'), arcname=n+'.exe'); z.write('LICENSE', arcname='LICENSE-GPLv3.txt'); z.close()"
          Get-Item "dist/${env:APP_NAME}-Windows-x64.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-Windows
          path: dist/${{ env.APP_NAME }}-Windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 发布 Release（notes 由 GitHub bot 自动生成）
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # 少一个安装包就让任务红掉：action-gh-release 默认只警告，会静默发出单品 Release
          fail_on_unmatched_files: true
          body: |
            ## 下载
            - **macOS（Apple Silicon / M 系列）**：`SmartYouth-macOS-arm64.dmg`
              （挂载后是「智慧团委.app」）
            - **Windows（64 位）**：`SmartYouth-Windows-x64.zip`
              （解压后运行「智慧团委.exe」）

            GitHub 的下载文件名不支持非 ASCII 字符，所以安装包用英文名，
            安装后的应用名是「智慧团委」。

            仅支持 Apple Silicon（M 系列）。Intel Mac 不再提供安装包。
                        Windows 不提供 32 位版本：PySide6 6.x 只发布 x64 与 arm64 轮子，
            无法编译 32 位程序。

            ## 首次运行说明
            - **macOS**：应用未做签名与公证，首次打开若提示「无法验证开发者」，
              请在访达中**右键 → 打开**，或终端执行：
              `xattr -cr /Applications/智慧团委.app`
            - **Windows**：同样无代码签名，SmartScreen 可能提示「已保护你的电脑」，
              点「更多信息 → 仍要运行」。

            完整变更列表见下方自动生成的更新日志（由 GitHub bot 生成）。
          files: |
            artifacts/SmartYouth-macOS-arm64/SmartYouth-macOS-arm64.dmg
            artifacts/SmartYouth-Windows/SmartYouth-Windows-x64.zip
