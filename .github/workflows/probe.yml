name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: env
        run: |
          echo "SDK_ROOT=[$ANDROID_SDK_ROOT]"
          echo "ANDROID_HOME=[$ANDROID_HOME]"
          ls -d /usr/local/lib/android/sdk* 2>/dev/null || echo "no /usr/local/lib/android"
          ls /usr/local/lib/android/sdk 2>/dev/null || true
          ls /opt/android* 2>/dev/null || true
          which sdkmanager || true
          find /usr/local /opt -maxdepth 6 -name sdkmanager -type f 2>/dev/null | head -5
          find /usr/local /opt -maxdepth 4 -name "cmdline-tools" -type d 2>/dev/null | head -5
