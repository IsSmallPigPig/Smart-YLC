<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧团委 · 云端备份服务</title>
<style>
  :root { color-scheme: light dark }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1c1f23;
  }
  main { max-width: 34rem; padding: 2.5rem 2rem; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .6rem; letter-spacing: .01em }
  p { margin: 0 0 .8rem; color: #5b626b }
  code { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: #ebedf0; padding: .15em .45em; border-radius: 4px }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e6e8eb }
    p { color: #9aa3ad }
    code { background: #24272c }
  }
</style>
</head>
<body>
<main>
  <h1>这是智慧团委的云端备份接口，不是网页</h1>
  <p>应用通过 <code>GET /api/backup?id=提取码</code> 取回备份、<code>PUT /api/backup?id=提取码</code> 上传备份。内容在客户端加密，服务端只保存密文，没有提取码就打不开。</p>
  <p>在应用的「设置 → 云端备份」里填写本页地址即可。</p>
</main>
</body>
</html>
