<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="智慧团委 Smart-YLC">
  <defs>
    <!-- white surface: lit from the lower left, falling off into the upper right -->
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F1F4F7"/>
      <stop offset="1" stop-color="#C6D0DC"/>
    </linearGradient>
    <radialGradient id="bgLight" cx="0.28" cy="0.68" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- the upper-right corner recedes, giving the slab its thickness -->
    <radialGradient id="cornerShade" cx="1" cy="0" r="0.62">
      <stop offset="0" stop-color="#2E4258" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2E4258" stop-opacity="0"/>
    </radialGradient>

    <!-- laser sweep raking across the white surface -->
    <linearGradient id="laserSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE9EE" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#FFE9EE" stop-opacity="0.75"/>
      <stop offset="0.36" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#FFE9EE" stop-opacity="0.5"/>
      <stop offset="0.82" stop-color="#FFE9EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFE9EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.66" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="0.9" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sweepBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="coreBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <radialGradient id="lineGrad" cx="50" cy="52" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8B99"/>
      <stop offset="0.5" stop-color="#F4737F"/>
      <stop offset="1" stop-color="#D95C6E"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="50" cy="50" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0F3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF0F3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGrad" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FF8092"/>
      <stop offset="1" stop-color="#E52B47"/>
    </radialGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.9"/>
    </filter>

    <!-- 圆角矩形就是图标的边界：底色、反光、辉光、标记全部裁在这里面 -->
    <clipPath id="frame">
      <rect x="4" y="4" width="92" height="92" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- 所有图层都在圆角矩形之内，没有外投影、没有溢出的辉光 -->
  <g clip-path="url(#frame)">
    <rect x="4" y="4" width="92" height="92" fill="url(#bg)"/>
    <rect x="4" y="4" width="92" height="92" fill="url(#bgLight)"/>
    <rect x="4" y="4" width="92" height="92" fill="url(#cornerShade)"/>

    <!-- surface treatment -->
    <g transform="rotate(-45 50 50)" filter="url(#sweepBlur)" opacity="0.95">
      <rect x="-60" y="41" width="220" height="18" fill="url(#laserSweep)"/>
    </g>
    <g transform="rotate(-45 50 50)" filter="url(#coreBlur)" opacity="0.4">
      <rect x="-60" y="31" width="220" height="2.6" fill="url(#laserCore)"/>
    </g>
    <g transform="rotate(-45 50 50)" filter="url(#coreBlur)">
      <rect x="-60" y="48.7" width="220" height="2.6" fill="url(#laserCore)"/>
    </g>

    <!-- mark -->
    <g transform="translate(0 2)">
      <circle cx="50" cy="50" r="22" fill="url(#hubGlow)"/>

      <g filter="url(#bloom)" opacity="0.4">
        <g stroke="#FF8C9B" stroke-width="4.4" stroke-linecap="round" fill="none">
          <line x1="50" y1="50" x2="50" y2="24"/>
          <line x1="50" y1="50" x2="72.5" y2="37"/>
          <line x1="50" y1="50" x2="72.5" y2="63"/>
          <line x1="50" y1="50" x2="50" y2="76"/>
          <line x1="50" y1="50" x2="27.5" y2="63"/>
          <line x1="50" y1="50" x2="27.5" y2="37"/>
        </g>
        <g fill="#FF8C9B">
          <circle cx="50" cy="24" r="4.5"/>
          <circle cx="72.5" cy="37" r="4"/>
          <circle cx="72.5" cy="63" r="4"/>
          <circle cx="50" cy="76" r="4"/>
          <circle cx="27.5" cy="63" r="4"/>
          <circle cx="27.5" cy="37" r="4"/>
          <circle cx="50" cy="50" r="9"/>
          <path d="M68.2,28 L65.0,29.0 L64,32.2 L63.0,29.0 L59.8,28 L63.0,27.0 L64,23.8 L65.0,27.0 Z"/>
        </g>
      </g>

      <g stroke="url(#lineGrad)" stroke-width="2.2" stroke-linecap="round" fill="none">
        <line x1="50" y1="50" x2="50" y2="24"/>
        <line x1="50" y1="50" x2="72.5" y2="37"/>
        <line x1="50" y1="50" x2="72.5" y2="63"/>
        <line x1="50" y1="50" x2="50" y2="76"/>
        <line x1="50" y1="50" x2="27.5" y2="63"/>
        <line x1="50" y1="50" x2="27.5" y2="37"/>
      </g>

      <g fill="#E96A7B">
        <circle cx="50" cy="24" r="4.5"/>
        <circle cx="72.5" cy="37" r="4"/>
        <circle cx="72.5" cy="63" r="4"/>
        <circle cx="50" cy="76" r="4"/>
        <circle cx="27.5" cy="63" r="4"/>
        <circle cx="27.5" cy="37" r="4"/>
      </g>

      <circle cx="50" cy="50" r="8.5" fill="url(#hubGrad)"/>
      <path d="M68.2,28 L65.0,29.0 L64,32.2 L63.0,29.0 L59.8,28 L63.0,27.0 L64,23.8 L65.0,27.0 Z" fill="#F4737F"/>
    </g>

    <!-- 内侧描边：给白底一道收边，替代原来的外投影 -->
    <rect x="4.5" y="4.5" width="91" height="91" rx="21.5" ry="21.5"
          fill="none" stroke="#E4E8ED" stroke-width="1"/>
  </g>
</svg>
